<!DOCTYPE html>
<html>
	<head>
		<title>ESP32-C3</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="/static/coloris/coloris.min.css">
		<style>
		.clr-field button {
			width: 22px;
			height: 22px;
			left: 5px;
			right: auto;
			border-radius: 50%;
		}
		.clr-field input {
			width: 150px;
			height: 32px;
			padding: 0 10px;
			padding-left: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
			padding-left: 36px;
		}
		form {
			/* On centre le formulaire */
			margin: 0 auto;
			width: 400px;
			/* Le contour du formulaire */
			padding: 1em;
			border: 1px solid #ccc;
			border-radius: 1em;
		}
		ul {
			list-style: none;
			padding: 0;
			 margin: 0;
		}
		form li + li {
			margin-top: 1em;
		}
		label {
			/* Taille et alignement uniformes */
			display: inline-block;
			width: 90px;
			text-align: right;
		}
		input,
		textarea {
			/* On s'assure que les champs texte ont la même police
			Par défaut, les zones de texte ont une police à chasse fixe. */
			font: 1em sans-serif;

			/* Taille uniforme pour des champs */
			width: 300px;
			box-sizing: border-box;

			/* On utilise la même bordure que pour le formulaire */
			border: 1px solid #999;
		}

		input:focus,
		textarea:focus {
			/* On rajoute une mise en avant pour les éléments avec le focus. */
		border-color: #000;
		}

		.button {
			/* On aligne les boutons avec les champs texte. */
			padding-left: 90px; /* La même taille que les libellés */
		}
		button {
			/* Une marge supplémentaire représentant approximativement
			le même espace qu'entre les libellés et les champs. */
			margin-left: 0.5em;
		}
		</style>
	</head>
	<body>
		<h1>Add new wifi credentials</h1>
		<form action="/wifi" method="POST">
			<ul>
				<li>
					<label for="ssid">SSID&nbsp;:</label>
					<input type="text" id="ssid" name="SSID" />
				</li>
				<li>
					<label for="passw">Password&nbsp;:</label>
					<input type="text" id="passw" name="Password" />
				</li>
				<li>
					<input type="submit" />
				</li>
			</ul>
		</form>
	</body>
</html>
