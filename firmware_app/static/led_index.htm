<!DOCTYPE html>
<html>
	<head>
		<title>ESP32-C3</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="/static/coloris/coloris.min.css">
		<style>
		.clr-field button {
			width: 22px;
			height: 22px;
			left: 5px;
			right: auto;
			border-radius: 50%;
		}
		.clr-field input {
			width: 150px;
			height: 32px;
			padding: 0 10px;
			padding-left: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
			padding-left: 36px;
		}
		</style>
	</head>
	<body>
		<form method="POST">
			<input type="color" name="ledcolor" value="#000000" />
			<input type="submit" />
		</form>
		<script type="text/javascript" src="/static/coloris/coloris.min.js"></script>
		<script type="module">
		const cs = document.querySelectorAll('input[type=color]');
		for (const c of cs) {
			c.type = 'text';
			c.dataset.coloris = 'convert';
		}
		Coloris.setInstance('input[data-coloris=convert]', {
			theme: 'pill',
			themeMode: 'auto',
			margin: 10,
			alpha: false,
			swatches: [
				'#ff0000',
				'#ff8000',
				'#ffff00',
				'#80ff00',
				'#00ff00',
				'#00ff80',
				'#00ffff',
				'#0080ff',
				'#0000ff',
				'#8000ff',
				'#ff00ff',
				'#ff0080',
				'#000000',
			]
		});
		</script>
	</body>
</html>
